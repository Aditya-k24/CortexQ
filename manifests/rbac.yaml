apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeserve-operator
  namespace: kubeserve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeserve-operator
rules:
  # LLMDeployment CRD management
  - apiGroups: ["kubeserve.io"]
    resources: ["llmdeployments", "llmdeployments/status", "llmdeployments/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Manage child Deployments and Services
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # KEDA ScaledObjects and TriggerAuthentication
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects", "triggerauthentications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events (for kopf to record)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Needed by kopf for leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeserve-operator
subjects:
  - kind: ServiceAccount
    name: kubeserve-operator
    namespace: kubeserve
roleRef:
  kind: ClusterRole
  name: kubeserve-operator
  apiGroup: rbac.authorization.k8s.io
