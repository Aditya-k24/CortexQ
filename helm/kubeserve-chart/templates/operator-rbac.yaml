apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeserve-operator
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeserve-operator
rules:
  - apiGroups: ["kubeserve.io"]
    resources: ["llmdeployments", "llmdeployments/status", "llmdeployments/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects", "triggerauthentications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeserve-operator
subjects:
  - kind: ServiceAccount
    name: kubeserve-operator
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: kubeserve-operator
  apiGroup: rbac.authorization.k8s.io
