apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: llmdeployments.kubeserve.io
  annotations:
    helm.sh/hook: crd-install
spec:
  group: kubeserve.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["model", "provider"]
              properties:
                model:
                  type: string
                provider:
                  type: string
                minReplicas:
                  type: integer
                  minimum: 0
                  default: 1
                maxReplicas:
                  type: integer
                  minimum: 1
                  default: 10
                queueThreshold:
                  type: integer
                  minimum: 1
                  default: 5
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  scope: Namespaced
  names:
    plural: llmdeployments
    singular: llmdeployment
    kind: LLMDeployment
    shortNames: ["llmd"]
