namespace: kubeserve

redis:
  host: redis-master
  port: 6379
  password: ""

router:
  image: kubeserve/router:latest
  replicas: 2
  port: 8080
  models: "claude,gpt4,gemini"
  lbStrategy: round_robin
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  circuitBreaker:
    failureThreshold: 5
    successThreshold: 2
    timeout: 30

operator:
  image: kubeserve/operator:latest
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

mockBackend:
  image: kubeserve/mock-backend:latest
  latencyMin: 0.05
  latencyMax: 0.5
  errorRate: 0.01

# LLM model deployments to create via LLMDeployment CRD
llmDeployments:
  - name: claude
    model: claude
    provider: anthropic
    minReplicas: 0
    maxReplicas: 20
    queueThreshold: 5
  - name: gpt4
    model: gpt4
    provider: openai
    minReplicas: 1
    maxReplicas: 15
    queueThreshold: 10
  - name: gemini
    model: gemini
    provider: google
    minReplicas: 1
    maxReplicas: 10
    queueThreshold: 8

monitoring:
  enabled: true
  prometheusNamespace: monitoring
  grafana:
    enabled: true

argocd:
  enabled: false
  repoURL: https://github.com/org/kubeserve
  targetRevision: main
